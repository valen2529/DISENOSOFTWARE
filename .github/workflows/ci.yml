name: CI Pipeline

# ── 1. TRIGGERS ──
on:
  push:
    branches: [ main, Valentina ]
  pull_request:
    branches: [ main ]

# ── 2. ENV VARS globales ──
env:
  NODE_ENV: test
  APP_NAME: runwaysync

# ── 3. JOBS ──
jobs:

  # ── Job 1: Lint (se ejecuta inmediatamente) ──
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: RunwaySync/package-lock.json

      - name: Instalar dependencias
        working-directory: RunwaySync
        run: npm ci

      - name: Linting
        working-directory: RunwaySync
        run: npm run lint

  # ── Job 2: Tests (se ejecuta en paralelo con lint) ──
  test:
    name: Tests Unitarios
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: RunwaySync/package-lock.json

      - name: Instalar dependencias
        working-directory: RunwaySync
        run: npm ci

      - name: Tests unitarios
        working-directory: RunwaySync
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: RunwaySync/coverage/
          if-no-files-found: ignore

  # ── Job 3: Build (espera que lint Y test terminen con éxito) ──
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: [ lint, test ]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: RunwaySync/package-lock.json

      - name: Instalar dependencias
        working-directory: RunwaySync
        run: npm ci

      - name: Verificar archivos críticos
        run: |
          test -f RunwaySync/src/app.js              && echo "✅ app.js"
          test -f RunwaySync/src/routes/router.js    && echo "✅ router.js"
          test -f RunwaySync/src/models/User.model.js && echo "✅ User.model.js"
          test -f RunwaySync/views/index.ejs         && echo "✅ index.ejs"
          test -f RunwaySync/views/dashboard.ejs     && echo "✅ dashboard.ejs"
          test -f RunwaySync/views/equipo.ejs        && echo "✅ equipo.ejs"
          test -f RunwaySync/views/proyectos.ejs     && echo "✅ proyectos.ejs"
          test -f RunwaySync/views/eventos.ejs       && echo "✅ eventos.ejs"

      - name: Build exitoso
        run: echo "✅ Build completado correctamente para ${{ env.APP_NAME }}"

  # ── Job 4: Deploy (solo si build tuvo éxito) ──
  deploy:
    name: Deploy Notification
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Notificar deploy
        run: |
          echo "🚀 ${{ env.APP_NAME }} listo para deploy en Render"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Autor: ${{ github.actor }}"
